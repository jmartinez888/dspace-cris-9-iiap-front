networks:
  dspacenet:

services:
  frontend:
    image: ghcr.io/jmartinez888/dspace-cris-9-iiap-front:development
    environment:
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: '0.0.0.0'
      DSPACE_UI_PORT: '4000'
      DSPACE_UI_NAMESPACE: /
      DSPACE_REST_SSL: 'true'
      DSPACE_REST_HOST: api-cris.iiap.gob.pe
      DSPACE_REST_PORT: 443
      DSPACE_REST_NAMESPACE: /server
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    networks:
      dspacenet:
    ports:
      - published: 4000
        target: 4000
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
