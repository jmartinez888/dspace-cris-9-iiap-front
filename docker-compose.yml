networks:
  dspacenet:

services:
  frontend:
    environment:
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: frontend
      DSPACE_UI_PORT: '4000'
      DSPACE_UI_NAMESPACE: /
      DSPACE_REST_SSL: 'true'
      DSPACE_REST_HOST: api-cris.iiap.gob.pe
      DSPACE_REST_PORT: 443
      DSPACE_REST_NAMESPACE: /server
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    build:
      context: .
      dockerfile: Dockerfile.dist
    networks:
      dspacenet:
    ports:
    - published: 4000
      target: 4000
    stdin_open: true
    tty: true
    restart: unless-stopped
    # ── Resource Limits for Dokploy / 16 GB VPS ──
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 1G
