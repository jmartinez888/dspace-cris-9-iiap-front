networks:
  dspacenet:

services:
  frontend:
    image: ghcr.io/jmartinez888/dspace-cris-9-iiap-front:development
    pull_policy: always
    environment:
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: '0.0.0.0'
      DSPACE_UI_PORT: '4000'
      DSPACE_UI_NAMESPACE: /
      DSPACE_REST_SSL: 'true'
      DSPACE_REST_HOST: api-cris.iiap.gob.pe
      DSPACE_REST_PORT: 443
      DSPACE_REST_NAMESPACE: /server
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_OPTIONS: '--max-old-space-size=896'
    networks:
      dspacenet:
    ports:
      - published: 4000
        target: 4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/app/client/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.2G
        reservations:
          cpus: '0.25'
          memory: 256M
