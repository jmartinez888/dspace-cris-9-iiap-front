networks:
  dspacenet:

services:
  frontend:
    # By default deploy the current development image. Set DSPACE_UI_IMAGE_TAG
    # to a sha-* tag for an explicit rollback.
    image: ghcr.io/jmartinez888/dspace-cris-9-iiap-front:${DSPACE_UI_IMAGE_TAG:-development}
    # A mutable tag must always be pulled during a Dokploy deployment. Without
    # this, restarting the compose project can keep an obsolete local image.
    pull_policy: always
    environment:
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: '0.0.0.0'
      DSPACE_UI_PORT: '4000'
      DSPACE_UI_NAMESPACE: /
      DSPACE_REST_SSL: 'true'
      DSPACE_REST_HOST: api-cris.iiap.gob.pe
      DSPACE_REST_PORT: 443
      DSPACE_REST_NAMESPACE: /server
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    networks:
      dspacenet:
    ports:
      - published: 4000
        target: 4000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Reserve capacity for the REST backend and the rest of the host.
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 768M
