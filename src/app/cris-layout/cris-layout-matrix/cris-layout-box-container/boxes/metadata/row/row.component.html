@for (cell of row.cells; track cell; let lastCell = $last) {
<div class="d-flex flex-column col metadata-cell" [class]="cell.style">
  @for (field of cell.fields; track trackUpdate($index, field)) {
  <ds-metadata-container class="w-100" [box]="box" [item]="item" [field]="field"></ds-metadata-container>
  }

  @if ((box.shortname === 'details' || box.shortname === 'namecard') && lastCell && isLastRow) {
  <div class="full-view-link mt-3 mb-2">
    <a [routerLink]="['/items', item.uuid, 'full']" class="btn btn-outline-primary">
      <i class="fas fa-info-circle"></i> {{ 'item.page.link.full' | translate }}
    </a>
  </div>
  }
</div>
}
