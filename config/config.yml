ui:
  ssl: false
  host: localhost
  port: 4000
  nameSpace: /

rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

fallbackLanguage: es

ssr:
  enabled: true

cache:
  serverSide:
    debug: false
    botCache:
      max: 500
      timeToLive: 86400000 # 1 day
      allowStale: true
    anonymousCache:
      max: 200
      timeToLive: 60000 # 1 minute
      allowStale: true

languages:
  - code: es
    label: Español
    active: true
  - code: en
    label: English
    active: true
  - code: de
    label: Deutsch
    active: true
  - code: fr
    label: Français
    active: true
