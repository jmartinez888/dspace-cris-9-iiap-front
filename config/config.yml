ui:
  ssl: false
  host: localhost
  port: 4000
  nameSpace: /

rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

fallbackLanguage: es

ssr:
  enabled: true

# Cache only public SSR responses. Community and collection search routes are
# served client-side in production, so this cache protects the remaining
# indexable public pages without caching authenticated content.
cache:
  serverSide:
    botCache:
      max: 250
      timeToLive: 86400000 # 24 hours
      allowStale: true
    anonymousCache:
      max: 75
      timeToLive: 60000 # 1 minute
      allowStale: true

languages:
  - code: es
    label: Español
    active: true
  - code: en
    label: English
    active: true
  - code: de
    label: Deutsch
    active: true
  - code: fr
    label: Français
    active: true
