# =============================================================================
# CI/CD — Build & Push to GHCR + Auto-Cleanup
# =============================================================================
# Este workflow:
#   1. Compila dist/ directamente en el runner, con cachés persistentes de
#      node_modules, de Angular (.angular/cache) y de Mirador
#   2. Empaqueta dist/ con Dockerfile.runtime y sube la imagen a GitHub
#      Container Registry (GHCR) con tag inmutable sha-<commit>
#      (y con el tag mutable :development solo desde la rama development)
#   3. Conserva las últimas versiones para permitir rollback vía
#      DSPACE_UI_IMAGE_TAG=sha-<commit> y elimina las más antiguas
#   4. Despliega en Dokploy vía API (solo desde development)
#
# GitHub expulsa las cachés tras 7 días sin uso; cache-keepalive.yml las
# mantiene vivas entre deploys espaciados.
#
# Lanzarlo con workflow_dispatch en otra rama compila y publica la imagen
# sha-<commit> sin mover :development ni desplegar en producción.
# =============================================================================

name: Build & Deploy to GHCR

on:
  push:
    branches:
      - development
    # Cambios que no afectan a la imagen no deben compilar ni desplegar.
    # Para forzar un deploy usar workflow_dispatch.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - 'cypress/**'
      - 'e2e/**'
      - 'lint/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'skills-lock.json'
  # Permite ejecución manual desde la pestaña "Actions"
  workflow_dispatch:

# Only the newest revision of each branch should consume a build runner or deploy.
concurrency:
  group: dspace-cris-ui-${{ github.ref }}
  cancel-in-progress: true

# ── Variables reutilizables ──────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # jmartinez888/dspace-cris-9-iiap-front
  # Versiones de la imagen que se conservan en GHCR para poder hacer rollback
  KEEP_VERSIONS: 10

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 🐳 Build, Push & Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ────────────────────────────────────────────────────────
      # 1. Checkout del código fuente
      # ────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      # ────────────────────────────────────────────────────────
      # 2. Node.js y dependencias
      #    node_modules se cachea por versión de Node + hash del
      #    lockfile; npm ci solo corre cuando cambia el lockfile.
      # ────────────────────────────────────────────────────────
      - name: 🟢 Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # node_modules is cached explicitly; the npm download cache would be redundant.
          package-manager-cache: false

      - name: 📦 Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          # The Cypress binary is only needed for e2e tests, never for this build.
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci --no-audit --no-fund

      # ────────────────────────────────────────────────────────
      # 3. Build de Angular (browser + server)
      #    La caché persistente de Angular se restaura de la última
      #    ejecución y se guarda con una clave nueva en cada run.
      #    Browser y server se compilan en paralelo si el runner tiene
      #    RAM suficiente (16 GB en repos públicos; los privados tienen
      #    8 GB y compilan en secuencia).
      # ────────────────────────────────────────────────────────
      - name: 💾 Restore Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            angular-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            angular-cache-${{ runner.os }}-

      - name: 🏗️ Build Angular (browser + server)
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # angular.json only enables the disk cache outside CI by default.
          npx ng config cli.cache.environment all
          mem_gb=$(awk '/MemTotal/ {print int($2 / 1048576)}' /proc/meminfo)
          echo "Runner: $(nproc) vCPU, ${mem_gb} GB RAM"
          if [ "$mem_gb" -ge 14 ]; then
            echo "Building browser and server bundles in parallel"
            npx ng build --configuration production > browser-build.log 2>&1 &
            browser_pid=$!
            npx ng run dspace-angular:server:production > server-build.log 2>&1 &
            server_pid=$!
            status=0
            wait "$browser_pid" || status=1
            wait "$server_pid" || status=1
            echo "::group::Browser build log"; cat browser-build.log; echo "::endgroup::"
            echo "::group::Server build log"; cat server-build.log; echo "::endgroup::"
            grep -h "Time: " browser-build.log server-build.log || true
            exit "$status"
          else
            echo "Building browser and server bundles sequentially"
            npx ng build --configuration production
            npx ng run dspace-angular:server:production
          fi

      # ────────────────────────────────────────────────────────
      # 4. Visor Mirador: solo se recompila si cambian sus fuentes,
      #    su config de webpack o las dependencias.
      # ────────────────────────────────────────────────────────
      - name: 🖼️ Restore Mirador build
        id: mirador-cache
        uses: actions/cache@v6
        with:
          path: dist/iiif
          key: mirador-${{ hashFiles('webpack/webpack.mirador.config.ts', 'src/mirador-viewer/**', 'package-lock.json') }}

      - name: 🖼️ Build Mirador
        if: steps.mirador-cache.outputs.cache-hit != 'true'
        run: npm run build:mirador

      # ────────────────────────────────────────────────────────
      # 5. Configurar Docker Buildx
      #    driver: docker usa el BuildKit integrado del Docker del runner
      #    y no descarga la imagen moby/buildkit de Docker Hub. No se
      #    exporta caché de BuildKit, así que el driver docker-container
      #    no aporta nada.
      # ────────────────────────────────────────────────────────
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # ────────────────────────────────────────────────────────
      # 6. Autenticación en GHCR
      # ────────────────────────────────────────────────────────
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────
      # 7. Empaquetado y push de la imagen Docker
      #    - Tag inmutable por revisión para trazabilidad y rollback
      #    - Tag mutable :development (el que usa Dokploy) solo desde development
      #    - Dockerfile.runtime solo copia dist/ y config/ ya compilados
      # ────────────────────────────────────────────────────────
      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/development' && format('{0}/{1}:development', env.REGISTRY, env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Forzar arquitectura única — evita manifiestos multi-arch fantasma
          platforms: linux/amd64
          # Desactivar provenance — evita la arquitectura "unknown/unknown"
          # que rompe el pull en Dokploy/Docker clients
          provenance: false
          # Pasar las build args necesarias
          build-args: |
            NODE_VERSION=22

      # ────────────────────────────────────────────────────────
      # 8. Limpieza de versiones antiguas
      #    Conserva las KEEP_VERSIONS versiones más recientes (rollback)
      #    y elimina el resto. Usa la API REST directamente porque
      #    actions/delete-package-versions sigue en Node 20, retirado
      #    de los runners de GitHub el 2026-09-23.
      # ────────────────────────────────────────────────────────
      - name: 🧹 Keep only the newest image versions
        continue-on-error: true # No bloquear el deploy por la limpieza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: users/${{ github.repository_owner }}/packages/container/dspace-cris-9-iiap-front
        run: |
          gh api --paginate "$PACKAGE_PATH/versions?per_page=100" \
            --jq '.[] | [.id, .created_at] | @tsv' \
            | sort -t $'\t' -k2,2r \
            | tail -n +$((KEEP_VERSIONS + 1)) \
            | cut -f1 \
            | while read -r id; do
                echo "Deleting package version $id"
                gh api -X DELETE "$PACKAGE_PATH/versions/$id"
              done

      # ────────────────────────────────────────────────────────
      # 9. Deploy en Dokploy vía API, una vez publicada la imagen
      #    Usa compose.deploy en lugar del webhook: el webhook exige
      #    activar Autodeploy, y entonces la GitHub App de Dokploy
      #    también desplegaría al hacer merge, antes de que exista la
      #    imagen nueva.
      #    Secrets: DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_COMPOSE_ID.
      #    Solo desde development: otras ramas no deben desplegar.
      # ────────────────────────────────────────────────────────
      - name: 🚀 Trigger Dokploy deploy
        if: success() && github.ref == 'refs/heads/development'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          payload=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "$(git log -1 --format=%s)" \
            --arg description "Image sha-$GITHUB_SHA (run $GITHUB_RUN_ID)" \
            '{composeId: $composeId, title: $title, description: $description}')
          status=$(curl -sS -o dokploy-response.json -w '%{http_code}' \
            -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "$payload")
          echo "Dokploy HTTP $status: $(cat dokploy-response.json)"
          # Any answer other than 200 means Dokploy did not queue a deployment.
          test "$status" = "200"

      - name: 📋 Deploy summary
        if: success()
        run: |
          echo "##🐳 Build exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Imagen:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Fecha:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Desplegado en Dokploy:** ${{ github.ref == 'refs/heads/development' && 'sí' || 'no (rama distinta de development)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Se conservan las ${{ env.KEEP_VERSIONS }} versiones más recientes en GHCR (rollback con DSPACE_UI_IMAGE_TAG=sha-<commit>)." >> $GITHUB_STEP_SUMMARY
